services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gocafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gocafe}
      POSTGRES_DB: ${POSTGRES_DB:-gocafe}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - gocafe_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gocafe}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gocafe_db_data:
